version: 2

models:
  # ==============================================================================
  # mart_customer_360 — GD4.2 + GD4.4
  # ==============================================================================
  - name: mart_customer_360
    description: >
      Bảng Customer 360 tổng hợp hồ sơ đầy đủ của từng khách hàng.
      Grain: 1 dòng / customer_unique_id có ít nhất 1 đơn delivered.
      Khớp 100% đặc tả schema thiết kế (ERD / Mart Diagram).
    meta:
      owner: "@data-team"
      task: "GD4.2 + GD4.4"
      design_exception: "Đọc silver_orders cho delivery features do fact_sales chưa có order_estimated_delivery_date"
      business_definition: >
        Bảng phẳng Customer 360 tập trung toàn bộ đặc trưng của khách hàng
        tại mức hạt customer_unique_id, phục vụ phân tích CLV và giám sát chất lượng giao hàng.
        RFM và cụm K-Means nằm ở mart_customer_rfm (theo ERD GD4.1).
    config:
      tags: ['mart', 'customer', 'customer_360', 'gd4.2', 'gd4.4']

    columns:
      # --- 0. Khóa chính ---
      - name: customer_unique_id
        data_type: varchar
        description: "Khóa khách hàng duy nhất (PK, UUID ẩn danh)"
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_unique_id

      # --- 1. Lịch sử mua hàng ---
      - name: first_order_date
        data_type: date
        description: "Ngày mua đầu tiên của khách hàng (DATE)"
        tests:
          - not_null

      - name: last_order_date
        data_type: date
        description: "Ngày mua gần nhất của khách hàng (DATE)"
        tests:
          - not_null

      # --- 2. Thông tin địa lý mới nhất ---
      - name: latest_city
        data_type: varchar
        description: "Thành phố mới nhất"

      - name: latest_state
        data_type: varchar
        description: "Bang mới nhất (2 ký tự)"

      - name: latest_zip_code_prefix
        data_type: varchar
        description: "Mã bưu chính mới nhất"

      # --- 3. Đơn hàng & Giá trị mua hàng ---
      - name: total_orders
        data_type: bigint
        description: "Tổng số đơn hàng delivered"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"

      - name: total_gmv
        data_type: decimal(10, 2)
        description: "Tổng giá trị mua hàng (GMV)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: aov
        data_type: decimal(10, 2)
        description: "Giá trị đơn hàng trung bình = total_gmv / total_orders"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      # --- 4. Đánh giá ---
      - name: avg_review_score
        data_type: decimal(3, 2)
        description: "Điểm đánh giá trung bình (1.00 - 5.00)"

      # --- 5. Vòng đời & Tần suất ---
      - name: customer_lifespan_days
        data_type: bigint
        description: "Số ngày từ đơn đầu tiên đến đơn cuối cùng"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      # --- 6. CLV (Customer Lifetime Value) ---
      - name: clv_historical
        data_type: decimal(10, 2)
        description: "CLV lịch sử = tổng GMV các đơn delivered. Không phải CLV dự báo."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      # --- 7. Các đặc trưng mở rộng phục vụ ML & Phân tích (GD4.4) ---
      - name: latitude
        data_type: double
        description: "Vĩ độ địa lý"

      - name: longitude
        data_type: double
        description: "Kinh độ địa lý"

      - name: cohort_date
        data_type: date
        description: "Cohort date"

      - name: total_revenue
        data_type: decimal(10, 2)
        description: "Tổng doanh thu sản phẩm thuần"

      - name: total_freight_paid
        data_type: decimal(10, 2)
        description: "Tổng cước vận chuyển"

      - name: total_reviewed_orders
        data_type: bigint
        description: "Số đơn hàng đã đánh giá"

      - name: positive_review_rate
        data_type: double
        description: "Tỷ lệ đánh giá tích cực"

      - name: avg_lead_time_days
        data_type: double
        description: "Thời gian giao hàng trung bình (ngày)"

      - name: min_lead_time_days
        data_type: bigint
        description: "Thời gian giao hàng nhanh nhất (ngày)"

      - name: max_lead_time_days
        data_type: bigint
        description: "Thời gian giao hàng lâu nhất (ngày)"

      - name: on_time_delivery_rate
        data_type: double
        description: "Tỷ lệ giao hàng đúng hẹn"

      - name: orders_on_time
        data_type: bigint
        description: "Số đơn giao đúng hẹn"

      - name: orders_late
        data_type: bigint
        description: "Số đơn giao trễ"

      - name: avg_delivery_delay_days
        data_type: double
        description: "Độ trễ giao hàng trung bình (ngày)"

      - name: avg_freight_per_order
        data_type: double
        description: "Cước phí trung bình mỗi đơn"

      - name: dbt_created_at
        data_type: timestamp
        description: "Thời điểm nạp dữ liệu"
        tests:
          - not_null

  # ==============================================================================
  # mart_customer_rfm — GD4.12
  # ==============================================================================
  - name: mart_customer_rfm
    description: >
      Bảng RFM 1 dòng / customer_unique_id (khách có ít nhất 1 đơn delivered).
      Chứa 3 đặc trưng đầu vào K-Means (recency_days, frequency, monetary) và cluster_id
      gán từ kết quả K-Means (source ml.customer_cluster). Nhóm đã bỏ chấm điểm RFM (r/f/m_score, segment).
    meta:
      owner: "@data-team"
      task: "GD4.12"
      run_order: "build model -> chạy notebooks/04_ml_clustering.ipynb -> build lại model để lấy cluster_id"
    config:
      tags: ['mart', 'customer', 'customer_cluster', 'gd4.12']

    columns:
      - name: customer_unique_id
        data_type: varchar
        description: "Khóa khách hàng (PK; FK logic sang mart_customer_360)"
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('mart_customer_360')
              field: customer_unique_id

      - name: recency_days
        data_type: integer
        description: "Số ngày từ đơn delivered cuối cùng đến ngày mua delivered gần nhất toàn hệ thống"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: frequency
        data_type: integer
        description: "Số đơn delivered (= mart_customer_360.total_orders)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"

      - name: monetary
        data_type: decimal(10, 2)
        description: "Tổng GMV các đơn delivered, BRL (= mart_customer_360.total_gmv)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: cluster_id
        data_type: integer
        description: "Cụm K-Means (FK sang dim_customer_cluster); -1 nếu chưa có kết quả phân cụm"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer_cluster')
              field: cluster_id

      - name: dbt_created_at
        data_type: timestamp
        description: "Thời điểm nạp dữ liệu"
        tests:
          - not_null

  # ==============================================================================
  # obs_pipeline_health — GD4.6
  # ==============================================================================
  - name: obs_pipeline_health
    description: >
      View hợp nhất toàn bộ trạng thái Data Observability của kho dữ liệu Olist,
      tổng hợp từ 4 tầng: Bronze (freshness, volume, schema drift), Silver (kiểm toán đối soát dòng, DQ flags),
      Gold (kiểm toán doanh thu IFRS 15, cước phí, dòng tiền), và Mart (bảo toàn grain Customer 360).
    meta:
      owner: "@data-team"
      task: "GD4.6"
    config:
      tags: ['mart', 'observability', 'pipeline_health', 'gd4.6']

    columns:
      - name: obs_id
        description: "Mã định danh duy nhất của từng bản ghi kiểm toán"
        tests:
          - unique
          - not_null

      - name: pipeline_layer
        description: "Phân tầng kho dữ liệu được kiểm toán"
        tests:
          - not_null
          - accepted_values:
              values: ['BRONZE', 'SILVER', 'GOLD', 'MART']

      - name: entity_or_check_name
        description: "Tên bảng hoặc chỉ số kiểm toán cụ thể"
        tests:
          - not_null

      - name: health_status
        description: "Trạng thái sức khỏe kiểm toán"
        tests:
          - not_null
          - accepted_values:
              values: ['PASS', 'WARN', 'FAIL', 'OK']

      - name: gate_action
        description: "Hành động điều khiển cổng pipeline"
        tests:
          - not_null
          - accepted_values:
              values: ['ALLOW', 'BLOCK']

  # ==============================================================================
  # dim_customer_cluster — GD4.12
  # ==============================================================================
  - name: dim_customer_cluster
    description: >
      Bảng chiều phân cụm khách hàng, 1 dòng / cluster_id (thêm dòng -1 cho khách chưa phân cụm).
      Số liệu, nhãn và mô tả đọc từ source ml.cluster_profile do notebooks/04_ml_clustering.ipynb ghi ra
      (K-Means trên recency_days, frequency, monetary của mart_customer_rfm), không gõ tay.
    meta:
      owner: "@data-team"
      task: "GD4.12"
    config:
      tags: ['mart', 'customer', 'customer_cluster', 'gd4.12']

    columns:
      - name: cluster_id
        data_type: integer
        description: "Mã cụm (PK); -1 = chưa phân cụm"
        tests:
          - unique
          - not_null

      - name: cluster_label
        data_type: varchar
        description: "Tên cụm do notebook sinh theo luật từ chân dung cụm"
        tests:
          - unique
          - not_null

      - name: cluster_description
        data_type: varchar
        description: "Mô tả đặc điểm cụm, sinh từ các chỉ số của cụm"
        tests:
          - not_null

      - name: n_customers
        data_type: integer
        description: "Số khách trong cụm"
        tests:
          - not_null

      - name: pct_customers
        data_type: decimal(5, 2)
        description: "% khách của cụm trên tổng số khách"
        tests:
          - not_null

      - name: sum_monetary
        data_type: decimal(12, 2)
        description: "Tổng monetary (GMV delivered, BRL) của cụm"
        tests:
          - not_null

      - name: pct_monetary
        data_type: decimal(5, 2)
        description: "% monetary của cụm trên tổng"
        tests:
          - not_null

      - name: median_recency_days
        data_type: double
        description: "Trung vị recency_days của cụm"

      - name: mean_frequency
        data_type: double
        description: "Số đơn delivered trung bình của cụm"

      - name: repeat_rate
        data_type: double
        description: "Tỷ lệ khách có từ 2 đơn delivered (0-1)"

      - name: median_monetary
        data_type: decimal(10, 2)
        description: "Trung vị monetary của cụm (BRL)"

      - name: mean_monetary
        data_type: double
        description: "Monetary trung bình của cụm (BRL)"

      - name: avg_review_score
        data_type: double
        description: "Điểm review trung bình của cụm (chỉ để mô tả, không đưa vào K-Means)"

      - name: late_order_rate
        data_type: double
        description: "Tỷ lệ đơn giao trễ của cụm, 0-1 (chỉ để mô tả, không đưa vào K-Means)"

      - name: top_state
        data_type: varchar
        description: "Bang có nhiều khách nhất trong cụm"

      - name: k
        data_type: integer
        description: "Số cụm của lần chạy mô hình"

      - name: feature_set_version
        data_type: varchar
        description: "Phiên bản bộ đặc trưng (rfm_v1)"

      - name: model_run_ts
        data_type: timestamp
        description: "Thời điểm chạy mô hình"

      - name: dbt_created_at
        data_type: timestamp
        description: "Thời điểm nạp dữ liệu"
        tests:
          - not_null
