version: 2

models:
  - name: fact_customer_reviews
    description: >
      Bảng Fact đánh giá đơn hàng từ khách hàng (Customer Reviews Fact).
      Độc lập hoàn toàn với fact_sales để triệt tiêu lỗi nhân bản lượt đánh giá (Fan-Out).
      Grain: 1 dòng đại diện cho 1 lần khách hàng gửi phản hồi đánh giá cho 1 đơn hàng (99,224 dòng).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_id
            - order_id
      - dbt_utils.equal_rowcount:
          compare_model: ref('silver_order_reviews')

    columns:
      - name: review_key
        description: "Khóa thay thế (Surrogate Key) băm từ review_id và order_id"
        tests:
          - unique
          - not_null

      - name: review_id
        description: "Mã định danh đánh giá (phần 1 của khóa chính ghép tự nhiên)"
        tests:
          - not_null

      - name: order_id
        description: "Mã đơn hàng (phần 2 của khóa chính ghép & Chiều thoái hóa làm cầu nối Cross-Fact sang fact_sales)"
        tests:
          - not_null

      - name: review_creation_date_key
        description: "Khóa ngoại ngày gửi phiếu khảo sát (định dạng YYYYMMDD)"
        tests:
          - not_null

      - name: review_answer_date_key
        description: "Khóa ngoại ngày khách hàng phản hồi khảo sát (định dạng YYYYMMDD, -1 nếu thiếu)"
        tests:
          - not_null

      - name: customer_unique_id
        description: "Mã khách hàng duy nhất (Conformed FK kết nối sang dim_customer)"
        tests:
          - not_null

      - name: review_score
        description: "Điểm đánh giá từ 1 đến 5 sao của khách hàng"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

      - name: response_time_hours
        description: "Thời gian phản hồi đánh giá tính bằng giờ (khoảng cách giữa creation date và answer timestamp)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: has_comment_title
        description: "Cờ nhị phân (1 nếu có tiêu đề đánh giá, 0 nếu không)"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: has_comment_message
        description: "Cờ nhị phân (1 nếu có nội dung bình luận chi tiết, 0 nếu không)"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: dbt_created_at
        description: "Thời điểm dbt nạp dữ liệu vào bảng Fact"
        tests:
          - not_null
