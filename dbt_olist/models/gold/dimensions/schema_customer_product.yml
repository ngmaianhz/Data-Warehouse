version: 2

models:
  - name: dim_customer
    description: "Bảng chiều thông tin khách hàng (SCD Type 1)"
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null

  - name: dim_product
    description: "Bảng chiều thông tin sản phẩm chuẩn hóa song ngữ"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        tests:
          - not_null
