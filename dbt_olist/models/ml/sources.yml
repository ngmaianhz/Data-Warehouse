version: 2
sources:
  - name: ml
    schema: ml
    description: "Kết quả K-Means trên recency_days, frequency, monetary (mart_customer_rfm) do notebooks/04_ml_clustering.ipynb ghi ra (không do dbt build). dbt đọc lại để dựng mart_customer_rfm.cluster_id và dim_customer_cluster."
    tables:
      - name: customer_cluster
        columns:
          - name: customer_unique_id
            tests:
              - unique
              - not_null
              - relationships:
                  to: ref('mart_customer_360')
                  field: customer_unique_id
          - name: cluster_id
            tests: [not_null]
      - name: cluster_profile
        columns:
          - name: cluster_id
            tests: [unique, not_null]
          - name: cluster_label
            tests: [unique, not_null]
          - name: cluster_description
            tests: [not_null]
      - name: kmeans_model_selection
        columns:
          - name: k
            tests: [unique, not_null]

