version: 2

models:
  - name: silver_orders
    description: >
      Bảng đơn hàng tổng quan tầng Silver (chuẩn hóa từ olist_orders_dataset).
      Bảo toàn 100% số dòng từ Bronze (99,441 dòng duy nhất).
      Đã ép kiểu an toàn 5 cột mốc thời gian bằng TRY_CAST, xử lý đơn thiếu ngày giao hàng
      và gắn cờ kiểm soát tiến trình thời gian (is_valid_chronology).
    columns:
      - name: order_key
        description: "Khóa thay thế (Surrogate Key) băm từ order_id"
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Mã định danh duy nhất của đơn hàng (Natural Primary Key)"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Mã khách hàng cho từng đơn đặt hàng (Foreign Key)"
        tests:
          - not_null

      - name: order_status
        description: "Trạng thái đơn hàng (đã chuẩn hóa chữ thường và cắt khoảng trắng)"
        tests:
          - not_null
          - accepted_values:
              values:
                - 'delivered'
                - 'shipped'
                - 'canceled'
                - 'unavailable'
                - 'invoiced'
                - 'processing'
                - 'created'
                - 'approved'

      - name: order_purchase_timestamp
        description: "Thời điểm khách hàng bấm đặt mua (bắt buộc phải có)"
        tests:
          - not_null

      - name: order_approved_at
        description: "Thời điểm thanh toán được phê duyệt (có thể NULL nếu đơn chưa duyệt hoặc hủy)"

      - name: order_delivered_carrier_date
        description: "Thời điểm đơn hàng được bàn giao cho đối tác vận chuyển"

      - name: order_delivered_customer_date
        description: "Thời điểm khách hàng thực tế nhận được hàng"

      - name: order_estimated_delivery_date
        description: "Thời điểm dự kiến giao hàng ban đầu do hệ thống tính toán"
        tests:
          - not_null

      - name: has_cast_error
        description: "Cờ phát hiện lỗi ép kiểu timestamp (TRUE nếu chuỗi gốc có giá trị nhưng TRY_CAST ra NULL)"
        tests:
          - not_null

      - name: is_delivery_missing
        description: >
          Cờ phát hiện đơn hàng có trạng thái 'delivered' nhưng bị thiếu ngày giao hàng 
          (NULL ở order_delivered_customer_date hoặc order_delivered_carrier_date - 9 dòng).
          Hợp lệ (FALSE) đối với các đơn có trạng thái khác 'delivered'.
        tests:
          - not_null

      - name: is_valid_chronology
        description: >
          Cờ tính hợp lệ về mặt thứ tự thời gian của đơn hàng (FALSE cho đúng 1,382 đơn hàng vi phạm:
          1,359 đơn duyệt sau khi đã giao vận chuyển + 23 đơn giao vận chuyển sau khi khách đã nhận).
          Bảo toàn dòng, không xóa bỏ nhằm giữ vẹn toàn 100% dữ liệu gốc.
        tests:
          - not_null

      - name: _load_timestamp
        description: "Thời điểm nạp bản ghi vào kho dữ liệu"
        tests:
          - not_null

      - name: _source_file
        description: "Tên file CSV nguồn ban đầu"

      - name: _run_id
        description: "Mã UUID của phiên nạp dữ liệu Bronze"
