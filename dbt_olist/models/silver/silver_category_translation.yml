version: 2

models:
  - name: silver_category_translation
    description: >
      Bảng tra cứu dịch tên ngành hàng từ tiếng Bồ Đào Nha sang tiếng Anh.
      Bảo toàn chính xác 100% số dòng so với Bronze (71 dòng duy nhất).
    columns:
      - name: category_key
        description: "Khóa thay thế (Surrogate Key) băm từ product_category_name"
        tests:
          - unique
          - not_null

      - name: product_category_name
        description: "Tên danh mục gốc bằng tiếng Bồ Đào Nha (Natural Primary Key)"
        tests:
          - unique
          - not_null

      - name: product_category_name_english
        description: "Tên danh mục đã dịch sang tiếng Anh"
        tests:
          - not_null

      - name: _load_timestamp
        description: "Thời điểm nạp bản ghi vào kho dữ liệu"
        tests:
          - not_null

      - name: _source_file
        description: "Tên file CSV nguồn ban đầu"

      - name: _run_id
        description: "Mã UUID của phiên nạp dữ liệu Bronze"
