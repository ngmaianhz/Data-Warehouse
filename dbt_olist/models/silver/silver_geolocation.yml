version: 2

models:
  - name: silver_geolocation
    description: >
      Bảng Geolocation tầng Silver chuẩn hóa và tổng hợp tọa độ không gian từ olist_geolocation_dataset.
      Mỗi bản ghi đại diện cho một mã bưu chính duy nhất (zip code prefix 5 số, grain 1:1), 
      được tính toán tọa độ trung tâm (centroid) bằng trung bình cộng các điểm hợp lệ trong lãnh thổ Brazil.
      Tên thành phố và bang được chuẩn hóa (loại bỏ dấu, chữ thường) và lấy theo giá trị phổ biến nhất (MODE).
      Bảo toàn nguyên vẹn 19,015 mã bưu chính (100% độ phủ mã zip) để phục vụ Dimension Geolocation tầng Gold.
    columns:
      - name: geolocation_key
        description: "Khóa thay thế (Surrogate Key) băm từ zip_code_prefix"
        tests:
          - unique
          - not_null

      - name: geolocation_zip_code_prefix
        description: "Mã bưu chính chuẩn 5 chữ số (Natural Primary Key của Dimension Geolocation)"
        tests:
          - unique
          - not_null

      - name: geolocation_lat
        description: >
          Vĩ độ trung tâm (Centroid Latitude) trong lãnh thổ Brazil [-34.0, +6.0].
          Giá trị NULL nếu 100% tọa độ gốc rơi ngoài lãnh thổ Brazil (được đánh dấu qua is_valid_coordinates = FALSE).

      - name: geolocation_lng
        description: >
          Kinh độ trung tâm (Centroid Longitude) trong lãnh thổ Brazil [-74.0, -32.0],
          đã bao trọn quần đảo Fernando de Noronha (-32.41°).
          Giá trị NULL nếu 100% tọa độ gốc rơi ngoài lãnh thổ Brazil.

      - name: geolocation_city
        description: "Tên thành phố đại diện chuẩn hóa (chữ thường, bỏ dấu tiếng Bồ Đào Nha, lấy theo MODE)"
        tests:
          - not_null

      - name: geolocation_state
        description: "Mã bang 2 ký tự (UF) đại diện cho mã zip (lấy theo MODE)"
        tests:
          - not_null
          - accepted_values:
              values:
                - 'AC'
                - 'AL'
                - 'AM'
                - 'AP'
                - 'BA'
                - 'CE'
                - 'DF'
                - 'ES'
                - 'GO'
                - 'MA'
                - 'MG'
                - 'MS'
                - 'MT'
                - 'PA'
                - 'PB'
                - 'PE'
                - 'PI'
                - 'PR'
                - 'RJ'
                - 'RN'
                - 'RO'
                - 'RR'
                - 'RS'
                - 'SC'
                - 'SE'
                - 'SP'
                - 'TO'

      - name: is_valid_coordinates
        description: "Cờ kiểm toán: TRUE nếu có tọa độ GPS hợp lệ tại Brazil, FALSE nếu toàn bộ tọa độ gốc là rác/ngoài biên giới"
        tests:
          - not_null

      - name: coordinate_sample_size
        description: "Tổng số lượng mẫu tọa độ GPS gốc thu thập được cho mã zip này"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"

      - name: valid_coordinate_points
        description: "Số lượng mẫu tọa độ hợp lệ nằm trong Bounding Box Brazil"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: dbt_updated_at
        description: "Thời điểm dbt build/refresh dữ liệu Silver"
        tests:
          - not_null
