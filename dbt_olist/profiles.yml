dbt_olist:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{% if env_var('MOTHERDUCK_TOKEN', '') != '' %}md:olist_warehouse{% else %}d:/Data-Warehouse/data/olist_warehouse.duckdb{% endif %}"
      threads: 4
      token: "{{ env_var('MOTHERDUCK_TOKEN', '') }}"
    local:
      type: duckdb
      path: 'd:/Data-Warehouse/data/olist_warehouse.duckdb'
      threads: 4
